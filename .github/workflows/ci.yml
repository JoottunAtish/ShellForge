name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dependency changes must arrive through a reviewed commit, never as a side
  # effect of a build. This is the default since Go 1.16; setting it explicitly
  # means a future change to that default cannot weaken the guarantee.
  GOFLAGS: -mod=readonly

jobs:
  # -------------------------------------------------------------------------
  # Fast gates. These fail in seconds and catch the most common mistakes, so
  # they run before anything that needs a toolchain matrix.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Branch naming. Runs first and fails in seconds: it is cheaper to rename a
  # branch now than to discover at merge time that the work is not traceable to
  # a decision.
  # -------------------------------------------------------------------------
  branch:
    name: Branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Branch is <kind>/issue-<number>
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # Dependabot has its own naming and we do not fight it.
          case "$BRANCH" in
            dependabot/*) echo "OK: dependabot branch, exempt"; exit 0 ;;
          esac

          if printf '%s' "$BRANCH" | grep -qE '^(feature|bug|chore)/issue-[0-9]+$'; then
            echo "OK: $BRANCH"
            exit 0
          fi

          echo "FAIL: branch name '$BRANCH' does not match <kind>/issue-<number>"
          echo
          echo "  feature/issue-24   new capability, new levels or content"
          echo "  bug/issue-31       something behaves incorrectly"
          echo "  chore/issue-7      docs, CI, refactor, dependencies"
          echo
          echo "Every branch traces to a ticket. Open the issue first, then:"
          echo "  git branch -m <kind>/issue-<number>"
          echo "  git push origin -u <kind>/issue-<number>"
          exit 1

  style:
    name: Style and punctuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No em dashes, en dashes, or smart quotes
        # Rule 0 in CLAUDE.md. A smart quote in a copy-pasteable command is a
        # broken command, and an em dash in a level briefing renders as a box in
        # a terminal that is not UTF-8 clean.
        run: ./scripts/check-punctuation.sh

      - name: Allowlist regexp consistency
        # A value that can start with a hyphen is flag-shaped: once it reaches
        # an argv vector as a positional operand, docker or wsl.exe reads it
        # as an option instead. The strict form in the security skill closes
        # that off; this gate keeps a looser copy from quietly coming back.
        run: ./scripts/check-allowlist-regexp.sh

      - name: No CRLF in files bound for the sandbox
        # CRLF in a .sh produces "bad interpreter: /bin/bash^M" inside Linux.
        # .gitattributes prevents it; this proves .gitattributes is working.
        #
        # grep -U stops GNU grep from doing its own line-ending translation, so
        # a stray CR is actually seen rather than silently normalized away.
        run: |
          set -uo pipefail
          bad=$(git ls-files -z -- '*.sh' '*.bash' '*.yaml' '*.yml' '*.go' \
                                   'images/bin/*' 'images/rc/*' 'Makefile' 'Containerfile' \
                | xargs -0 -r grep -lU "$(printf '\r')" 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "FAIL: carriage returns found in files that must be LF:"
            echo "$bad"
            echo
            echo "These run inside Linux. CRLF gives: bad interpreter: /bin/bash^M"
            exit 1
          fi
          echo "OK: no CRLF in sandbox-bound files"

      - name: Percent-encoder unit test (instrument.bash)
        run: bash images/rc/instrument_test.bash

      - name: No CI job escapes the merge gate, no action pinned to a tag
        # Two invariants, one script.
        #
        # Asserts that `all-green` depends on every job, that it is
        # `if: always()`, and that every produced check is required in the
        # ruleset. Without this, adding a job silently creates a check that can
        # fail without blocking a merge.
        #
        # Also asserts that every `uses:` names a commit SHA rather than a tag.
        # A tag is a mutable pointer: whoever controls it can repoint it at any
        # commit, and this workflow would run that commit with the repository
        # token.
        run: |
          python3 -m pip install --quiet pyyaml pytest
          python3 scripts/check-ci-gates.py

      - name: The gate checker's own tests
        # A check nobody tests is a check that quietly stops checking. These
        # cover the pinning matcher against known-good and known-bad references,
        # so a future relaxation of it fails here rather than going unnoticed.
        run: python3 -m pytest scripts/tests -q

      - name: CLI entry point package is present, tracked, and buildable
        # Issue #11: cmd/shellforge was never committed, and go build ./...
        # and go test ./... both silently skip a package that is not there.
        # scripts/tests/test_check_cli_package.py already runs above, as
        # part of the pytest step; this step exercises the gate for real.
        run: ./scripts/check-cli-package.sh

      - name: Sandbox shims are executable
        run: |
          set -euo pipefail
          fail=0
          for f in images/bin/*; do
            mode=$(git ls-files --stage "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "FAIL: $f is mode $mode, expected 100755"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK: all shims executable"
          exit $fail

  # -------------------------------------------------------------------------
  # Build and test on both platforms that matter. Windows is not optional here:
  # it is the primary persona and the place things break.
  # -------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "FAIL: these files are not gofmt -s clean:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -s -w ."
            exit 1
          fi
          echo "OK: gofmt clean"

      - name: Verify go.mod and go.sum are tidy
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod go.mod.bak
          [ -f go.sum ] && cp go.sum go.sum.bak || true
          go mod tidy
          if ! diff -q go.mod go.mod.bak > /dev/null; then
            echo "FAIL: go.mod is not tidy. Run: go mod tidy"
            diff go.mod.bak go.mod || true
            exit 1
          fi
          if [ -f go.sum.bak ] && ! diff -q go.sum go.sum.bak > /dev/null; then
            echo "FAIL: go.sum is not tidy. Run: go mod tidy"
            exit 1
          fi
          rm -f go.mod.bak go.sum.bak
          echo "OK: modules tidy"

      - name: Build cmd/shellforge
        # A module with no main package still builds -v ./... cleanly, which
        # is exactly what let this directory go untracked and uncompiled
        # until #11. Building the main package by name fails loudly if it
        # ever goes missing again, rather than passing by omission.
        run: go build -o bin/shellforge ./cmd/shellforge

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Layer dependency rule
        # internal/game must never import a Docker or WSL type. This is what
        # keeps "drop WSL support" a one-day decision.
        run: go test -v ./internal/archtest/...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        # The PTY multiplexer is concurrent by nature, so this is not optional.
        run: go test -race ./...

      - name: make build produces a runnable binary (Linux)
        # go build ./... above proves the packages compile, but nothing yet
        # proves the documented build command works: the Makefile's own
        # -ldflags version stamping, and -o bin/shellforge, actually produce
        # a binary a learner could run. Exercises the real command from the
        # README rather than a paraphrase of it.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          make build
          test -x bin/shellforge
          ./bin/shellforge version

      - name: make.ps1 build produces a runnable binary (Windows)
        # Windows has no make by default, so make.ps1 is the documented build
        # command there. This proves the PowerShell path independently of the
        # Makefile: same -ldflags version stamping, same -o bin\shellforge.exe.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\make.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'bin\shellforge.exe')) {
            Write-Host "FAIL: bin\shellforge.exe was not produced" -ForegroundColor Red
            exit 1
          }
          & .\bin\shellforge.exe version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FAIL: bin\shellforge.exe version exited $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }

      - name: Fuzz the OSC parser
        # The parser consumes an adversarial byte stream by construction: the
        # learner can type any bytes at the prompt, including a forged OSC 133.
        # Thirty seconds is not a proof, it is a tripwire that catches a panic
        # or a chunk-boundary regression before it reaches anybody.
        #
        # A step inside this job, not a job of its own: scripts/check-ci-gates.py
        # asserts that all-green depends on every job and that every produced
        # check is required in .github/rulesets/main.json, so a new job would
        # need a ruleset change to stay inside the merge gate.
        #
        # Linux only. Fuzzing needs coverage instrumentation and a writable
        # build cache, the Windows runner is slower, and the parser has no
        # platform-specific code, so a second run buys minutes and nothing else.
        if: matrix.os == 'ubuntu-latest'
        run: go test -run '^FuzzParser$' -fuzz '^FuzzParser$' -fuzztime 30s ./internal/pty

      - name: Upload fuzz crashers
        # A red fuzz run destroys its own reproducer the moment the runner
        # workspace is torn down. Uploading the corpus directory keeps the
        # crashing input around long enough to add it to the seed corpus.
        # Linux only, matching the fuzz step itself; the directory does not
        # exist on the Windows leg, so if-no-files-found: ignore keeps that
        # leg's own (unrelated) failures from also failing on a missing path.
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: internal/pty/testdata/fuzz/FuzzParser/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Security. Separate job so a vulnerability report does not hide behind a
  # compile error, and so it can be read at a glance in the checks list.
  # -------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A current toolchain, deliberately NOT the go.mod floor. The security
      # tools track recent Go releases (govulncheck v1.6.0 needs Go 1.25+), and
      # setup-go v7 sets GOTOOLCHAIN=local so `go install ...@latest` cannot
      # fetch a newer one for itself. A newer toolchain analyses a module
      # declaring an older floor correctly, so nothing is lost here. The Test
      # matrix keeps using go.mod, because verifying the declared floor is the
      # point of that job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: govulncheck
        # Reachability aware: reports only vulnerabilities this code can
        # actually hit, which keeps the signal usable instead of noise.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        # Subprocess handling, path traversal, credentials, weak crypto.
        # Shellforge shells out to docker and wsl.exe constantly, so the
        # subprocess rules are the ones that matter here.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude-dir=docs ./...

  # -------------------------------------------------------------------------
  # Documentation integrity. Every doctor failure code must link somewhere real.
  # -------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every doc anchor emitted by Go code exists in the docs
        # A doctor probe that points at a heading nobody wrote is worse than no
        # link at all: the learner follows it and lands nowhere.
        run: |
          set -uo pipefail
          missing=0
          anchors=$(grep -rhoE 'DocAnchor:\s*"[a-z0-9-]+"' --include='*.go' . \
                    | sed -E 's/.*"([a-z0-9-]+)".*/\1/' | sort -u || true)
          if [ -z "$anchors" ]; then
            echo "No doc anchors emitted yet, nothing to verify."
            exit 0
          fi
          for a in $anchors; do
            if ! grep -qE "^#{1,4} .*$a" docs/05-troubleshooting.md 2>/dev/null; then
              echo "FAIL: doc anchor '$a' has no heading in docs/05-troubleshooting.md"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "OK: every doc anchor resolves"
          exit $missing

      - name: No broken relative links in Markdown
        run: ./scripts/check-links.sh

  # -------------------------------------------------------------------------
  # The sandbox image. Not gated on the rest, because a Docker Hub hiccup should
  # not block a documentation fix.
  # -------------------------------------------------------------------------
  image:
    name: Sandbox image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the sandbox image
        run: docker build -f images/Containerfile -t shellforge-sandbox:ci images/

      - name: The image has what the curriculum teaches
        run: |
          set -euo pipefail
          docker run --rm shellforge-sandbox:ci bash -lc '
            set -e
            # Both vim and vi. vim-tiny provides vi but NOT vim, so checking
            # only one of them lets a package swap silently remove the other.
            for c in ls grep find sed awk less nano vim vi tree jq file htop man id sudo; do
              command -v "$c" >/dev/null || { echo "MISSING: $c"; exit 1; }
            done
            # Level 4 is "read the manual". If man pages were stripped, that
            # level is unplayable and the whole curriculum loses its spine.
            man ls >/dev/null 2>&1 || { echo "MISSING: man pages for ls"; exit 1; }
            id learner >/dev/null || { echo "MISSING: learner user"; exit 1; }
            # SF_STATE default: writable by learner, not under /opt/shellforge.
            # This shell is already the learner: the image declares USER
            # learner and learner has no password, so su would only ever
            # produce an authentication failure here.
            test -d /home/learner/.shellforge || { echo "MISSING: /home/learner/.shellforge"; exit 1; }
            test -O /home/learner/.shellforge || { echo "WRONG OWNER: /home/learner/.shellforge is not owned by the sandbox user"; exit 1; }
            touch /home/learner/.shellforge/probe && rm /home/learner/.shellforge/probe || { echo "NOT WRITABLE: /home/learner/.shellforge"; exit 1; }
            test ! -e /opt/shellforge/state || { echo "STALE: /opt/shellforge/state still exists"; exit 1; }
            echo "OK: image contents verified"
          '

      - name: Set up Go for the golden tests
        # This job runs no Go today, so the toolchain has to be installed here.
        # Pinned by commit SHA like every other action: scripts/check-ci-gates.py
        # rejects a tag pin.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Every level through the golden contract
        # The contract in docs/LEVEL-FORMAT.md section 7: set a level up, confirm
        # every required check FAILS, run the level's own solution, confirm they
        # PASS, confirm the checks changed nothing, tear down, confirm nothing was
        # left behind.
        #
        # It lives in this job rather than in Test because the sandbox image is
        # already built here. SHELLFORGE_GOLDEN is what keeps it OUT of Test:
        # ubuntu-latest has a working Docker daemon, so a daemon-only gate would
        # make `go test ./...` there start building the Containerfile and turn a
        # seconds-long job into a minutes-long one.
        env:
          SHELLFORGE_GOLDEN: "1"
        run: |
          set -euo pipefail
          docker tag shellforge-sandbox:ci shellforge-authortest:latest
          go test -run '^TestEveryLevelGoldenPath$|^TestPipe05RejectsNearMisses$' -timeout 30m -v ./cmd/shellforge/...

      - name: The rootfs tarball exports cleanly
        run: |
          set -euo pipefail
          docker create --name sf-export shellforge-sandbox:ci /bin/true
          docker export sf-export | gzip -9 > rootfs.tar.gz
          docker rm -f sf-export
          ls -lh rootfs.tar.gz
          sha256sum rootfs.tar.gz

  # -------------------------------------------------------------------------
  # The merge gate.
  #
  # GitHub only blocks a merge on checks listed as required in the ruleset. A
  # job that is not listed can fail and still be merged past, and a job added
  # later is not listed by definition. That is the hole this job closes.
  #
  # It depends on every other job, runs even when they fail, and fails if any
  # of them did not succeed. The ruleset requires THIS check, so any failing
  # job blocks the merge whether or not it is individually required.
  #
  # The individual checks stay in the ruleset as well. Belt and braces: this
  # job going missing or being renamed would otherwise silently open the hole
  # back up, and the meta-check in the `style` job guards against exactly that.
  # -------------------------------------------------------------------------
  all-green:
    name: All checks green
    runs-on: ubuntu-latest
    if: always()
    needs: [branch, style, test, security, docs, image]
    steps:
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # `branch` is the only job allowed to be skipped, and only because it
          # is scoped to pull_request events. Every other skip is treated as a
          # failure, so a job cannot escape the gate by not running.
          SKIPPABLE="branch"

          failed=0
          while read -r job result; do
            case "$result" in
              success)
                printf '  ok        %s\n' "$job"
                ;;
              skipped)
                if grep -qw "$job" <<<"$SKIPPABLE" && [ "$EVENT" != "pull_request" ]; then
                  printf '  skipped   %s (expected on %s)\n' "$job" "$EVENT"
                else
                  printf '  SKIPPED   %s (not allowed to skip here)\n' "$job"
                  failed=1
                fi
                ;;
              *)
                printf '  FAILED    %s (%s)\n' "$job" "$result"
                failed=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")

          if [ "$failed" -ne 0 ]; then
            echo
            echo "One or more checks did not pass. Merge is blocked."
            exit 1
          fi
          echo
          echo "All checks green."
