name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dependency changes must arrive through a reviewed commit, never as a side
  # effect of a build. This is the default since Go 1.16; setting it explicitly
  # means a future change to that default cannot weaken the guarantee.
  GOFLAGS: -mod=readonly

jobs:
  # -------------------------------------------------------------------------
  # Fast gates. These fail in seconds and catch the most common mistakes, so
  # they run before anything that needs a toolchain matrix.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Branch naming. Runs first and fails in seconds: it is cheaper to rename a
  # branch now than to discover at merge time that the work is not traceable to
  # a decision.
  # -------------------------------------------------------------------------
  branch:
    name: Branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Branch is <kind>/issue-<number>
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # Dependabot has its own naming and we do not fight it.
          case "$BRANCH" in
            dependabot/*) echo "OK: dependabot branch, exempt"; exit 0 ;;
          esac

          if printf '%s' "$BRANCH" | grep -qE '^(feature|bug|chore)/issue-[0-9]+$'; then
            echo "OK: $BRANCH"
            exit 0
          fi

          echo "FAIL: branch name '$BRANCH' does not match <kind>/issue-<number>"
          echo
          echo "  feature/issue-24   new capability, new levels or content"
          echo "  bug/issue-31       something behaves incorrectly"
          echo "  chore/issue-7      docs, CI, refactor, dependencies"
          echo
          echo "Every branch traces to a ticket. Open the issue first, then:"
          echo "  git branch -m <kind>/issue-<number>"
          echo "  git push origin -u <kind>/issue-<number>"
          exit 1

  style:
    name: Style and punctuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No em dashes, en dashes, or smart quotes
        # Rule 0 in CLAUDE.md. A smart quote in a copy-pasteable command is a
        # broken command, and an em dash in a level briefing renders as a box in
        # a terminal that is not UTF-8 clean.
        run: ./scripts/check-punctuation.sh

      - name: Allowlist regexp consistency
        # A value that can start with a hyphen is flag-shaped: once it reaches
        # an argv vector as a positional operand, docker or wsl.exe reads it
        # as an option instead. The strict form in the security skill closes
        # that off; this gate keeps a looser copy from quietly coming back.
        run: ./scripts/check-allowlist-regexp.sh

      - name: No CRLF in files bound for the sandbox
        # CRLF in a .sh produces "bad interpreter: /bin/bash^M" inside Linux.
        # .gitattributes prevents it; this proves .gitattributes is working.
        #
        # grep -U stops GNU grep from doing its own line-ending translation, so
        # a stray CR is actually seen rather than silently normalized away.
        run: |
          set -uo pipefail
          bad=$(git ls-files -z -- '*.sh' '*.bash' '*.yaml' '*.yml' '*.go' \
                                   'images/bin/*' 'images/rc/*' 'Makefile' 'Containerfile' \
                | xargs -0 -r grep -lU "$(printf '\r')" 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "FAIL: carriage returns found in files that must be LF:"
            echo "$bad"
            echo
            echo "These run inside Linux. CRLF gives: bad interpreter: /bin/bash^M"
            exit 1
          fi
          echo "OK: no CRLF in sandbox-bound files"

      - name: Percent-encoder unit test (instrument.bash)
        run: bash images/rc/instrument_test.bash

      - name: No CI job escapes the merge gate, no action pinned to a tag
        # Two invariants, one script.
        #
        # Asserts that `all-green` depends on every job, that it is
        # `if: always()`, and that every produced check is required in the
        # ruleset. Without this, adding a job silently creates a check that can
        # fail without blocking a merge.
        #
        # Also asserts that every `uses:` names a commit SHA rather than a tag.
        # A tag is a mutable pointer: whoever controls it can repoint it at any
        # commit, and this workflow would run that commit with the repository
        # token.
        run: |
          python3 -m pip install --quiet pyyaml pytest
          python3 scripts/check-ci-gates.py

      - name: The gate checker's own tests
        # A check nobody tests is a check that quietly stops checking. These
        # cover the pinning matcher against known-good and known-bad references,
        # so a future relaxation of it fails here rather than going unnoticed.
        run: python3 -m pytest scripts/tests -q

      - name: CLI entry point package is present, tracked, and buildable
        # Issue #11: cmd/shellforge was never committed, and go build ./...
        # and go test ./... both silently skip a package that is not there.
        # scripts/tests/test_check_cli_package.py already runs above, as
        # part of the pytest step; this step exercises the gate for real.
        run: ./scripts/check-cli-package.sh

      - name: Sandbox shims are executable
        run: |
          set -euo pipefail
          fail=0
          for f in images/bin/*; do
            mode=$(git ls-files --stage "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "FAIL: $f is mode $mode, expected 100755"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK: all shims executable"
          exit $fail

  # -------------------------------------------------------------------------
  # Build and test on both platforms that matter. Windows is not optional here:
  # it is the primary persona and the place things break.
  # -------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "FAIL: these files are not gofmt -s clean:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -s -w ."
            exit 1
          fi
          echo "OK: gofmt clean"

      - name: Verify go.mod and go.sum are tidy
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod go.mod.bak
          [ -f go.sum ] && cp go.sum go.sum.bak || true
          go mod tidy
          if ! diff -q go.mod go.mod.bak > /dev/null; then
            echo "FAIL: go.mod is not tidy. Run: go mod tidy"
            diff go.mod.bak go.mod || true
            exit 1
          fi
          if [ -f go.sum.bak ] && ! diff -q go.sum go.sum.bak > /dev/null; then
            echo "FAIL: go.sum is not tidy. Run: go mod tidy"
            exit 1
          fi
          rm -f go.mod.bak go.sum.bak
          echo "OK: modules tidy"

      - name: Build cmd/shellforge
        # A module with no main package still builds -v ./... cleanly, which
        # is exactly what let this directory go untracked and uncompiled
        # until #11. Building the main package by name fails loudly if it
        # ever goes missing again, rather than passing by omission.
        run: go build -o bin/shellforge ./cmd/shellforge

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Layer dependency rule
        # internal/game must never import a Docker or WSL type. This is what
        # keeps "drop WSL support" a one-day decision.
        run: go test -v ./internal/archtest/...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        # The PTY multiplexer is concurrent by nature, so this is not optional.
        run: go test -race ./...

      - name: make build produces a runnable binary (Linux)
        # go build ./... above proves the packages compile, but nothing yet
        # proves the documented build command works: the Makefile's own
        # -ldflags version stamping, and -o bin/shellforge, actually produce
        # a binary a learner could run. Exercises the real command from the
        # README rather than a paraphrase of it.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          make build
          test -x bin/shellforge
          ./bin/shellforge version

      - name: make.ps1 build produces a runnable binary (Windows)
        # Windows has no make by default, so make.ps1 is the documented build
        # command there. This proves the PowerShell path independently of the
        # Makefile: same -ldflags version stamping, same -o bin\shellforge.exe.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\make.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'bin\shellforge.exe')) {
            Write-Host "FAIL: bin\shellforge.exe was not produced" -ForegroundColor Red
            exit 1
          }
          & .\bin\shellforge.exe version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FAIL: bin\shellforge.exe version exited $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }

      - name: install.ps1 against a local fixture release (Windows)
        # install.ps1's only execution witness: there is no pwsh on the
        # machine that wrote it. This step builds the same shape of fixture
        # release scripts/tests/test_install_sh.py builds for install.sh,
        # under $env:RUNNER_TEMP, and drives install.ps1 through the seven
        # outcomes the Day 6 ticket requires: happy path, checksum mismatch,
        # refused overwrite, -Force overwrite, -NoPathChange, a reserved
        # device name as -BinDir, and an alternate data stream colon in
        # -BinDir. Three more cases follow: two that exercise Resolve-Version's
        # own default path (no -Version passed at all), which none of the
        # seven above do, since all seven pass -Version explicitly, and one
        # that seeds a REG_EXPAND_SZ user PATH value and asserts the
        # installer preserves it rather than flattening it. Two more close it
        # out: the postcondition the Unix suite's _snapshot_home enforces on
        # every one of its own cases, that nothing changed outside the target
        # -BinDir, checked here against the fixture directory and against the
        # user profile's own top level entries. It prints one line per case
        # and exits non-zero if any case did not behave as expected, and it
        # restores whatever the user PATH was before this step ran, so the
        # runner is left as it was found.
        #
        # Windows cannot run scripts/tests/fixtures/install/fake-shellforge
        # directly (a #!/bin/sh script cannot stand in for a required
        # shellforge.exe), so this step compiles its own tiny PE in its place.
        # That PE's behaviour is read out of the committed fixture's own text
        # rather than hardcoded a second time, so a rename or a format change
        # to the real fixture breaks this step with a clear error instead of
        # the two silently drifting apart.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = 0

          function Report {
            param([string]$Name, [bool]$Ok)
            if ($Ok) {
              Write-Host "OK    $Name"
            }
            else {
              Write-Host "FAIL  $Name" -ForegroundColor Red
              $script:failures++
            }
          }

          $installScript = Join-Path (Get-Location).Path 'scripts\install.ps1'
          $fakeSource = Join-Path (Get-Location).Path 'scripts\tests\fixtures\install\fake-shellforge'
          if (-not (Test-Path -LiteralPath $fakeSource)) {
            throw "fixture source not found: $fakeSource"
          }

          # Read the version string and the doctor exit-code variable name out
          # of the committed fixture itself, rather than hardcoding a second,
          # independent copy of both in this step's own C# source below.
          # Windows cannot run scripts/tests/fixtures/install/fake-shellforge
          # directly: it is a #!/bin/sh script, and install.ps1's contract
          # fixes the placed file's name at shellforge.exe, which Windows
          # refuses to run as a plain text file. So the fixture binary here
          # has to be a real, tiny PE, compiled on the fly rather than
          # committed. But reading the committed script's content to build
          # that PE, instead of only checking that the file exists, means a
          # rename or a format change to the real fixture breaks this step
          # with a clear error, rather than the two silently drifting apart.
          $fixtureText = Get-Content -LiteralPath $fakeSource -Raw
          if ($fixtureText -notmatch '(?s)version\)\s*\n\s*echo\s+"([^"]+)"') {
            throw "could not find the version) case's echo string in $fakeSource. Its format changed; update the regex this step reads it with."
          }
          $fixtureVersionString = $Matches[1]
          if ($fixtureText -notmatch '(?s)doctor\)\s*\n\s*exit\s+"\$\{([A-Za-z_][A-Za-z0-9_]*):-') {
            throw "could not find the doctor) case's exit variable in $fakeSource. Its format changed; update the regex this step reads it with."
          }
          $fixtureDoctorEnvVar = $Matches[1]

          # Build the fixture release under $env:RUNNER_TEMP. Plain text only is
          # committed to the repository; the archive and both SHA256SUMS files are
          # built here, at run time, matching scripts/tests/test_install_sh.py.
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'sf-install-fixture'
          $downloadRoot = Join-Path $fixtureDir 'release\download'
          $versionDir = Join-Path $downloadRoot 'v0.1.0-test'
          New-Item -ItemType Directory -Path $versionDir -Force | Out-Null

          $exeSourceDir = Join-Path $fixtureDir 'exe-src'
          New-Item -ItemType Directory -Path $exeSourceDir -Force | Out-Null
          $exePath = Join-Path $exeSourceDir 'shellforge.exe'

          # Go, not C# through Add-Type. `Add-Type -OutputType ConsoleApplication`
          # exists only in Windows PowerShell 5.1: PowerShell 7, which is what
          # `shell: pwsh` runs here and what every modern Windows box has, refuses
          # it outright with "Both the assembly types 'ConsoleApplication' and
          # 'WindowsApplication' are not currently supported", so the fixture
          # could never be built and this whole step failed before install.ps1
          # was invoked once. This job already ran actions/setup-go, so a Go
          # toolchain is right there, and `go build` on a single file works
          # outside a module.
          #
          # A plain array of lines joined with a newline, not a here string: a here
          # string's closing '@ has to sit at column zero, which would end this
          # step's YAML block scalar early. Every element is a single quoted
          # literal except the two that embed a value read from the committed
          # fixture above, which need double quotes so PowerShell interpolates
          # them; each embeds its Go double quote with a backtick escape.
          $goLines = @(
            'package main',
            '',
            'import (',
            '	"fmt"',
            '	"os"',
            '	"strconv"',
            ')',
            '',
            'func main() {',
            '	if len(os.Args) > 1 && os.Args[1] == "version" {',
            "		fmt.Println(`"$fixtureVersionString`")",
            '		os.Exit(0)',
            '	}',
            '	if len(os.Args) > 1 && os.Args[1] == "doctor" {',
            "		raw := os.Getenv(`"$fixtureDoctorEnvVar`")",
            '		code := 0',
            '		if raw != "" {',
            '			if n, err := strconv.Atoi(raw); err == nil {',
            '				code = n',
            '			}',
            '		}',
            '		os.Exit(code)',
            '	}',
            '	fmt.Fprintln(os.Stderr, "fake-shellforge: unknown command")',
            '	os.Exit(1)',
            '}'
          )
          $goSourcePath = Join-Path $exeSourceDir 'main.go'
          Set-Content -LiteralPath $goSourcePath -Value ($goLines -join "`n") -Encoding ascii -NoNewline
          go build -o $exePath $goSourcePath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $exePath)) {
            Write-Host "FAIL: could not build the fixture binary from $goSourcePath" -ForegroundColor Red
            exit 1
          }

          $zipPath = Join-Path $versionDir 'shellforge_v0.1.0-test_windows_amd64.zip'
          Compress-Archive -Path $exePath -DestinationPath $zipPath -Force

          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          $assetName = 'shellforge_v0.1.0-test_windows_amd64.zip'
          Set-Content -LiteralPath (Join-Path $versionDir 'SHA256SUMS') -Value "$digest  $assetName" -NoNewline -Encoding ascii

          # The mismatch fixture is a SECOND release root, built here, rather
          # than the good SHA256SUMS being swapped out and back in place around
          # case 2. Swapping restored byte-identical content but not the file's
          # LastWriteTimeUtc, and case 11 snapshots size plus mtime, so the
          # restore itself showed up as an unexpected change under fixtureDir
          # and failed the postcondition. Two roots means the good fixture is
          # never written to after this point, which is what case 11 is
          # actually there to assert.
          $flipped = if ($digest[-1] -ne '0') { '0' } else { '1' }
          $wrongDigest = $digest.Substring(0, $digest.Length - 1) + $flipped
          $mismatchRoot = Join-Path $fixtureDir 'release-mismatch\download'
          $mismatchVersionDir = Join-Path $mismatchRoot 'v0.1.0-test'
          New-Item -ItemType Directory -Path $mismatchVersionDir -Force | Out-Null
          Copy-Item -LiteralPath $zipPath -Destination (Join-Path $mismatchVersionDir $assetName) -Force
          Set-Content -LiteralPath (Join-Path $mismatchVersionDir 'SHA256SUMS') -Value "$wrongDigest  $assetName" -NoNewline -Encoding ascii

          $fixtureBaseUrl = ([System.Uri]$downloadRoot).AbsoluteUri
          $mismatchBaseUrl = ([System.Uri]$mismatchRoot).AbsoluteUri
          Write-Host "fixture base URL: $fixtureBaseUrl"
          Write-Host "mismatch base URL: $mismatchBaseUrl"

          $initialUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')

          # The postcondition test_install_sh.py's snapshot_home asserts on the
          # Unix side: nothing outside the target -BinDir was written. Two
          # roots matter here. $fixtureDir is where every case's own -BinDir
          # lives, snapshotted now, after the fixture release is built but
          # before any case runs install.ps1, so the "before" picture already
          # contains the fixture's own release and exe-src directories and the
          # diff below is only what the cases themselves add. $env:USERPROFILE
          # is snapshotted by its immediate children only, not recursively: a
          # real user profile holds far too many files to hash on every run,
          # and the only question worth asking here is whether install.ps1
          # left a new top level entry in the user's home directory, which
          # none of its real writes (its own -BinDir, its temporary WorkDir
          # under $env:TEMP, HKCU:\Environment) would ever do.
          function Get-FixtureSnapshot {
            param([string]$Root)
            $snap = @{}
            if (-not (Test-Path -LiteralPath $Root)) { return $snap }
            Get-ChildItem -LiteralPath $Root -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
              $rel = $_.FullName.Substring($Root.Length).TrimStart('\')
              $stamp = if ($_.PSIsContainer) { 'dir' } else { "$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }
              $snap[$rel] = $stamp
            }
            return $snap
          }
          $fixtureBefore = Get-FixtureSnapshot -Root $fixtureDir
          $userProfileBefore = @(Get-ChildItem -LiteralPath $env:USERPROFILE -Force -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Sort-Object)

          $versionPattern = [regex]::Escape($fixtureVersionString)

          try {
            # ---- Case 1: happy path ----
            $bin1 = Join-Path $fixtureDir 'bin-happy'
            $ok1 = $true
            try {
              & $installScript -Version 'v0.1.0-test' -BinDir $bin1 -BaseUrl $fixtureBaseUrl
            }
            catch {
              $ok1 = $false
              Write-Host "  case 1 threw: $_"
            }
            if ($ok1) {
              $exe1 = Join-Path $bin1 'shellforge.exe'
              $ok1 = Test-Path -LiteralPath $exe1 -PathType Leaf
              if ($ok1) {
                $out1 = & $exe1 version
                $ok1 = ($LASTEXITCODE -eq 0) -and (($out1 -join "`n") -match $versionPattern)
              }
            }
            Report 'case 1: happy path installs and runs' $ok1

            # ---- Case 2: checksum mismatch ----
            # Points at $mismatchBaseUrl, a separate release root whose
            # SHA256SUMS carries a digest with its last character flipped. The
            # good fixture is left untouched, so case 11's postcondition stays
            # honest: see the comment where the mismatch root is built.
            $bin2 = Join-Path $fixtureDir 'bin-mismatch'
            $threw2 = $false
            try {
              & $installScript -Version 'v0.1.0-test' -BinDir $bin2 -BaseUrl $mismatchBaseUrl
            }
            catch {
              $threw2 = $true
              Write-Host "  case 2 message: $_"
            }
            $exe2 = Join-Path $bin2 'shellforge.exe'
            $ok2 = $threw2 -and (-not (Test-Path -LiteralPath $exe2))
            Report 'case 2: checksum mismatch installs nothing' $ok2

            # ---- Case 3: refused overwrite ----
            $bin3 = Join-Path $fixtureDir 'bin-existing'
            New-Item -ItemType Directory -Path $bin3 -Force | Out-Null
            $target3 = Join-Path $bin3 'shellforge.exe'
            Set-Content -LiteralPath $target3 -Value 'not a real shellforge binary' -NoNewline
            $before3 = Get-Content -LiteralPath $target3 -Raw

            $threw3 = $false
            try {
              & $installScript -Version 'v0.1.0-test' -BinDir $bin3 -BaseUrl $fixtureBaseUrl
            }
            catch {
              $threw3 = $true
            }
            $after3 = Get-Content -LiteralPath $target3 -Raw
            $ok3 = $threw3 -and ($after3 -ceq $before3)
            Report 'case 3: refused overwrite without -Force' $ok3

            # ---- Case 4: -Force overwrite ----
            $ok4 = $true
            try {
              & $installScript -Version 'v0.1.0-test' -BinDir $bin3 -BaseUrl $fixtureBaseUrl -Force
            }
            catch {
              $ok4 = $false
            }
            if ($ok4) {
              $after4 = Get-Content -LiteralPath $target3 -Raw
              $ok4 = ($after4 -cne $before3)
            }
            Report 'case 4: -Force overwrites the existing file' $ok4

            # ---- Case 5: -NoPathChange ----
            $beforePath5 = [Environment]::GetEnvironmentVariable('Path', 'User')
            $bin5 = Join-Path $fixtureDir 'bin-nopathchange'
            $ok5 = $true
            try {
              & $installScript -Version 'v0.1.0-test' -BinDir $bin5 -BaseUrl $fixtureBaseUrl -NoPathChange
            }
            catch {
              $ok5 = $false
            }
            $afterPath5 = [Environment]::GetEnvironmentVariable('Path', 'User')
            if ($ok5) {
              $ok5 = ($afterPath5 -ceq $beforePath5)
            }
            Report 'case 5: -NoPathChange leaves the user PATH untouched' $ok5

            # ---- Case 6: reserved device name ----
            $bin6 = Join-Path $fixtureDir 'CON'
            $threw6 = $false
            try {
              & $installScript -Version 'v0.1.0-test' -BinDir $bin6 -BaseUrl $fixtureBaseUrl
            }
            catch {
              $threw6 = $true
            }
            $ok6 = $threw6 -and (-not (Test-Path -LiteralPath $bin6))
            Report 'case 6: reserved device name as -BinDir refuses' $ok6

            # ---- Case 7: alternate data stream colon ----
            $bin7 = "$fixtureDir\ads-target:hidden"
            $threw7 = $false
            try {
              & $installScript -Version 'v0.1.0-test' -BinDir $bin7 -BaseUrl $fixtureBaseUrl
            }
            catch {
              $threw7 = $true
            }
            $ok7 = $threw7 -and (-not (Test-Path -LiteralPath "$fixtureDir\ads-target"))
            Report 'case 7: alternate data stream colon in -BinDir refuses' $ok7

            # ---- Case 8 and 9: Resolve-Version's own default-version path ----
            # Every case above passes -Version, so none of them ever calls
            # Resolve-Version's real branch: the one that runs when a learner
            # does not pass -Version at all, which is the documented default
            # and the only path a plain `iwr install.ps1 | iex` ever takes.
            # That branch was broken on PowerShell 7 (this runner): it read
            # $response.BaseResponse.ResponseUri, a property that exists only
            # on 5.1's HttpWebResponse, not on 7's HttpResponseMessage, so it
            # threw under Set-StrictMode -Version Latest on every single
            # PowerShell 7 host, which is every host that runs this step.
            #
            # There is no tagged release yet for a real, unmocked call to
            # https://github.com/JoottunAtish/ShellForge/releases/latest to
            # resolve against, so this sources install.ps1's functions with
            # its unconditional trailing Invoke-Main call stripped, defines a
            # fake Invoke-WebRequest in the same scope to stand in for the
            # network call, and calls Resolve-Version directly with no
            # -RequestedVersion, exactly as Invoke-Main does when -Version is
            # not passed. Two shapes are exercised because Resolve-FinalUri
            # has to keep supporting both: PowerShell 7's real shape here on
            # the runner, and 5.1's, which is what a machine outside CI most
            # likely still runs.
            $testableInstallScript = Join-Path $env:RUNNER_TEMP 'install-testable.ps1'
            $installScriptText = Get-Content -LiteralPath $installScript -Raw
            $testableText = $installScriptText -replace '(?m)^Invoke-Main\s*$', ''
            Set-Content -LiteralPath $testableInstallScript -Value $testableText -NoNewline
            . $testableInstallScript

            function Invoke-WebRequest {
              # Stands in for the real cmdlet of the same name: PowerShell
              # resolves a function ahead of a cmdlet in the same scope, so
              # Resolve-Version calls this instead of reaching the network.
              param($Uri, $MaximumRedirection, [switch]$UseBasicParsing, $Method)
              if ($script:mockShape -eq 'ps7') {
                # PowerShell 7's real shape: BaseResponse is an
                # HttpResponseMessage, which has RequestMessage.RequestUri
                # and no ResponseUri property at all.
                $requestMessage = [pscustomobject]@{ RequestUri = [Uri]$script:mockTagUrl }
                $base = [pscustomobject]@{ RequestMessage = $requestMessage }
              }
              else {
                # PowerShell 5.1's real shape: BaseResponse is an
                # HttpWebResponse, which exposes ResponseUri directly.
                $base = [pscustomobject]@{ ResponseUri = [Uri]$script:mockTagUrl }
              }
              return [pscustomobject]@{ BaseResponse = $base }
            }

            $script:mockTagUrl = 'https://github.com/JoottunAtish/ShellForge/releases/tag/v9.9.9-mock'
            $script:mockShape = 'ps7'
            $tag8 = $null
            try {
              $tag8 = Resolve-Version -RequestedVersion '' -EffectiveBaseUrl $DefaultBaseUrl
            }
            catch {
              Write-Host "  case 8 threw: $_"
            }
            Report 'case 8: Resolve-Version default path resolves a tag (PS7 HttpResponseMessage shape)' ($tag8 -eq 'v9.9.9-mock')

            $script:mockShape = 'ps51'
            $tag9 = $null
            try {
              $tag9 = Resolve-Version -RequestedVersion '' -EffectiveBaseUrl $DefaultBaseUrl
            }
            catch {
              Write-Host "  case 9 threw: $_"
            }
            Report 'case 9: Resolve-Version default path resolves a tag (PS 5.1 HttpWebResponse shape)' ($tag9 -eq 'v9.9.9-mock')

            # The mock only stands in for cases 8 and 9. Cases 10+ below run
            # the real install.ps1 by path, which inherits functions
            # defined in this scope, and Get-Asset's file:// branch never
            # calls Invoke-WebRequest for this fixture anyway, but there is
            # no reason to leave a fake network cmdlet armed a moment
            # longer than the two cases that need it.
            Remove-Item Function:\Invoke-WebRequest -ErrorAction SilentlyContinue

            # ---- Case 10: a REG_EXPAND_SZ user PATH keeps its token ----
            # [Environment]::GetEnvironmentVariable('Path','User') always
            # returns the EXPANDED value, and
            # [Environment]::SetEnvironmentVariable always WRITES REG_SZ.
            # Update-UserPath used to go through only those two, which
            # meant a user PATH containing a token such as
            # %USERPROFILE%\.dotnet\tools or
            # %LOCALAPPDATA%\Microsoft\WindowsApps (both common) had that
            # token permanently flattened into a literal expanded path the
            # moment this installer ran. This seeds exactly that shape
            # directly in the registry, runs the installer, and asserts
            # the token and the REG_EXPAND_SZ kind both survive, then
            # restores whatever this runner's real value and kind were,
            # through the same raw registry path, not through
            # [Environment]::SetEnvironmentVariable, which would silently
            # reintroduce on this runner the exact bug this case checks.
            $envKeyPath = 'HKCU:\Environment'
            $envKeyBefore = Get-Item -LiteralPath $envKeyPath
            $hadPathValue = $envKeyBefore.GetValueNames() -contains 'Path'
            $savedRawPath = $envKeyBefore.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $savedPathKind = if ($hadPathValue) { $envKeyBefore.GetValueKind('Path') } else { [Microsoft.Win32.RegistryValueKind]::String }

            try {
              $testToken = '%USERPROFILE%\sf-install-fixture-marker'
              $seededRaw = if ($savedRawPath -eq '') { $testToken } else { "$savedRawPath;$testToken" }
              Set-ItemProperty -LiteralPath $envKeyPath -Name 'Path' -Value $seededRaw -Type ([Microsoft.Win32.RegistryValueKind]::ExpandString)

              $bin10 = Join-Path $fixtureDir 'bin-regexpand'
              $ok10 = $true
              try {
                & $installScript -Version 'v0.1.0-test' -BinDir $bin10 -BaseUrl $fixtureBaseUrl
              }
              catch {
                $ok10 = $false
                Write-Host "  case 10 threw: $_"
              }
              if ($ok10) {
                $afterKey = Get-Item -LiteralPath $envKeyPath
                $afterRaw = $afterKey.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                $afterKind = $afterKey.GetValueKind('Path')
                $ok10 = ($afterRaw -like "*$testToken*") -and ($afterKind -eq [Microsoft.Win32.RegistryValueKind]::ExpandString)
              }
              Report 'case 10: a REG_EXPAND_SZ user PATH keeps its token and its kind' $ok10
            }
            finally {
              if (-not $hadPathValue) {
                Remove-ItemProperty -LiteralPath $envKeyPath -Name 'Path' -ErrorAction SilentlyContinue
              }
              else {
                Set-ItemProperty -LiteralPath $envKeyPath -Name 'Path' -Value $savedRawPath -Type $savedPathKind
              }
            }
          }
          finally {
            # Leave the runner's own user PATH exactly as this step found it, whether
            # every case passed or not.
            [Environment]::SetEnvironmentVariable('Path', $initialUserPath, 'User')
          }

          # ---- Case 11 and 12: nothing was written outside the target directory ----
          # The postcondition the Unix suite's _snapshot_home enforces on
          # every case there: only the intended -BinDir changed. bin-existing
          # legitimately shows a change from case 3's own seeded victim file
          # and case 4's -Force overwrite, both already under bin-existing, so
          # the allow list below is by top level directory name, not "no
          # change at all".
          $fixtureAfter = Get-FixtureSnapshot -Root $fixtureDir
          $allowedBinDirs = @('bin-happy', 'bin-mismatch', 'bin-existing', 'bin-nopathchange', 'bin-regexpand')
          $fixtureKeys = @($fixtureBefore.Keys) + @($fixtureAfter.Keys) | Select-Object -Unique
          $unexpectedFixtureChanges = @()
          foreach ($key in $fixtureKeys) {
            if ($fixtureBefore[$key] -eq $fixtureAfter[$key]) { continue }
            $topSegment = $key.Split('\')[0]
            if ($allowedBinDirs -notcontains $topSegment) {
              $unexpectedFixtureChanges += $key
            }
          }
          $ok11 = ($unexpectedFixtureChanges.Count -eq 0)
          if (-not $ok11) {
            Write-Host "  unexpected changes under fixtureDir: $($unexpectedFixtureChanges -join ', ')"
          }
          Report 'case 11: only the cases own -BinDir paths changed under fixtureDir' $ok11

          $userProfileAfter = @(Get-ChildItem -LiteralPath $env:USERPROFILE -Force -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Sort-Object)
          $userProfileDiff = Compare-Object -ReferenceObject $userProfileBefore -DifferenceObject $userProfileAfter
          $ok12 = (-not $userProfileDiff)
          if (-not $ok12) {
            Write-Host "  unexpected top level change under USERPROFILE: $($userProfileDiff | Out-String)"
          }
          Report 'case 12: nothing new appeared directly under USERPROFILE' $ok12

          if ($failures -gt 0) {
            Write-Host "FAIL: $failures case(s) failed" -ForegroundColor Red
            exit 1
          }
          Write-Host 'OK: all twelve install.ps1 cases passed'
      - name: Fuzz the OSC parser
        # The parser consumes an adversarial byte stream by construction: the
        # learner can type any bytes at the prompt, including a forged OSC 133.
        # Thirty seconds is not a proof, it is a tripwire that catches a panic
        # or a chunk-boundary regression before it reaches anybody.
        #
        # A step inside this job, not a job of its own: scripts/check-ci-gates.py
        # asserts that all-green depends on every job and that every produced
        # check is required in .github/rulesets/main.json, so a new job would
        # need a ruleset change to stay inside the merge gate.
        #
        # Linux only. Fuzzing needs coverage instrumentation and a writable
        # build cache, the Windows runner is slower, and the parser has no
        # platform-specific code, so a second run buys minutes and nothing else.
        if: matrix.os == 'ubuntu-latest'
        run: go test -run '^FuzzParser$' -fuzz '^FuzzParser$' -fuzztime 30s ./internal/pty

      - name: Upload fuzz crashers
        # A red fuzz run destroys its own reproducer the moment the runner
        # workspace is torn down. Uploading the corpus directory keeps the
        # crashing input around long enough to add it to the seed corpus.
        # Linux only, matching the fuzz step itself; the directory does not
        # exist on the Windows leg, so if-no-files-found: ignore keeps that
        # leg's own (unrelated) failures from also failing on a missing path.
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: internal/pty/testdata/fuzz/FuzzParser/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Security. Separate job so a vulnerability report does not hide behind a
  # compile error, and so it can be read at a glance in the checks list.
  # -------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A current toolchain, deliberately NOT the go.mod floor. The security
      # tools track recent Go releases (govulncheck v1.6.0 needs Go 1.25+), and
      # setup-go v7 sets GOTOOLCHAIN=local so `go install ...@latest` cannot
      # fetch a newer one for itself. A newer toolchain analyses a module
      # declaring an older floor correctly, so nothing is lost here. The Test
      # matrix keeps using go.mod, because verifying the declared floor is the
      # point of that job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: govulncheck
        # Reachability aware: reports only vulnerabilities this code can
        # actually hit, which keeps the signal usable instead of noise.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        # Subprocess handling, path traversal, credentials, weak crypto.
        # Shellforge shells out to docker and wsl.exe constantly, so the
        # subprocess rules are the ones that matter here.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude-dir=docs ./...

  # -------------------------------------------------------------------------
  # Documentation integrity. Every doctor failure code must link somewhere real.
  # -------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every doc anchor emitted by Go code exists in the docs
        # A doctor probe that points at a heading nobody wrote is worse than no
        # link at all: the learner follows it and lands nowhere.
        run: |
          set -uo pipefail
          missing=0
          anchors=$(grep -rhoE 'DocAnchor:\s*"[a-z0-9-]+"' --include='*.go' . \
                    | sed -E 's/.*"([a-z0-9-]+)".*/\1/' | sort -u || true)
          if [ -z "$anchors" ]; then
            echo "No doc anchors emitted yet, nothing to verify."
            exit 0
          fi
          for a in $anchors; do
            if ! grep -qE "^#{1,4} .*$a" docs/05-troubleshooting.md 2>/dev/null; then
              echo "FAIL: doc anchor '$a' has no heading in docs/05-troubleshooting.md"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "OK: every doc anchor resolves"
          exit $missing

      - name: No broken relative links in Markdown
        run: ./scripts/check-links.sh

  # -------------------------------------------------------------------------
  # The sandbox image. Not gated on the rest, because a Docker Hub hiccup should
  # not block a documentation fix.
  # -------------------------------------------------------------------------
  image:
    name: Sandbox image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the sandbox image
        run: docker build -f images/Containerfile -t shellforge-sandbox:ci images/

      - name: The image has what the curriculum teaches
        run: |
          set -euo pipefail
          docker run --rm shellforge-sandbox:ci bash -lc '
            set -e
            # Both vim and vi. vim-tiny provides vi but NOT vim, so checking
            # only one of them lets a package swap silently remove the other.
            for c in ls grep find sed awk less nano vim vi tree jq file htop man id sudo; do
              command -v "$c" >/dev/null || { echo "MISSING: $c"; exit 1; }
            done
            # Level 4 is "read the manual". If man pages were stripped, that
            # level is unplayable and the whole curriculum loses its spine.
            man ls >/dev/null 2>&1 || { echo "MISSING: man pages for ls"; exit 1; }
            id learner >/dev/null || { echo "MISSING: learner user"; exit 1; }
            # perm-02 asks the learner to chgrp a file they own to logistics,
            # and a user may chgrp only to a group they already belong to. An
            # empty logistics group makes that objective unreachable by any
            # unprivileged command, which would surface as a level nobody can
            # pass rather than as a build failure.
            # Double quotes, not single. This whole script is already inside a
            # single-quoted `bash -lc '...'`, so a nested single quote ends it
            # and tr receives mangled arguments. That is what happened: the
            # assertion failed with "tr: missing operand" on every run, which
            # reads as a broken image rather than as a broken test.
            id -nG learner | tr " " "\n" | grep -qx logistics || { echo "MISSING: learner is not in the logistics group"; exit 1; }
            # SF_STATE default: writable by learner, not under /opt/shellforge.
            # This shell is already the learner: the image declares USER
            # learner and learner has no password, so su would only ever
            # produce an authentication failure here.
            test -d /home/learner/.shellforge || { echo "MISSING: /home/learner/.shellforge"; exit 1; }
            test -O /home/learner/.shellforge || { echo "WRONG OWNER: /home/learner/.shellforge is not owned by the sandbox user"; exit 1; }
            touch /home/learner/.shellforge/probe && rm /home/learner/.shellforge/probe || { echo "NOT WRITABLE: /home/learner/.shellforge"; exit 1; }
            test ! -e /opt/shellforge/state || { echo "STALE: /opt/shellforge/state still exists"; exit 1; }
            echo "OK: image contents verified"
          '

      - name: Set up Go for the golden tests
        # This job runs no Go today, so the toolchain has to be installed here.
        # Pinned by commit SHA like every other action: scripts/check-ci-gates.py
        # rejects a tag pin.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Every level through the golden contract
        # The contract in docs/LEVEL-FORMAT.md section 7: set a level up, confirm
        # every required check FAILS, run the level's own solution, confirm they
        # PASS, confirm the checks changed nothing, tear down, confirm nothing was
        # left behind.
        #
        # It lives in this job rather than in Test because the sandbox image is
        # already built here. SHELLFORGE_GOLDEN is what keeps it OUT of Test:
        # ubuntu-latest has a working Docker daemon, so a daemon-only gate would
        # make `go test ./...` there start building the Containerfile and turn a
        # seconds-long job into a minutes-long one.
        env:
          SHELLFORGE_GOLDEN: "1"
        run: |
          set -euo pipefail
          docker tag shellforge-sandbox:ci shellforge-authortest:latest
          go test -run '^TestEveryLevelGoldenPath$|^TestLevelsRejectNearMisses$|^TestSandboxHasNoHostMounts$|^TestSandboxIsolationLeavesTheHostUntouched$|^TestSudoIsRefusedByNoNewPrivileges$|^TestInstrumentationEmitsMarkersForARealSession$' -timeout 60m -v ./cmd/shellforge/...

      - name: The rootfs tarball exports cleanly and has what WSL import needs
        # The WSL runtime verifies a sha256 before `wsl --import` and refuses on
        # mismatch, and that verification means nothing if a tarball missing
        # /etc/wsl.conf ships anyway: interop and automount would default ON,
        # which is a silent breach of the safety promise, not a build failure.
        # So this asserts tarball content, not just that gzip exited 0.
        #
        # rootfs.tar.gz and rootfs.tar.gz.sha256 are the fixed filenames every
        # producer agrees on: this job, `make rootfs`, and `.\make.ps1 rootfs`.
        # The sidecar is sha256sum's own format so `sha256sum -c` works
        # unchanged and a Go implementation has one shape to parse.
        #
        # -n on gzip: without it, gzip stores a timestamp in the header and the
        # digest changes on every run of the exact same image, which defeats
        # the point of publishing a checksum at all.
        run: |
          set -euo pipefail
          docker create --name sf-export shellforge-sandbox:ci /bin/true
          docker export sf-export | gzip -9 -n > rootfs.tar.gz
          docker rm -f sf-export
          ls -lh rootfs.tar.gz
          sha256sum rootfs.tar.gz > rootfs.tar.gz.sha256
          cat rootfs.tar.gz.sha256

          # Captured once, not piped straight into grep -q: grep -q stops
          # reading the moment it has a match, tar gets SIGPIPE writing the
          # rest of the listing, and under pipefail that turns into "tar:
          # stdout: write error" and a nonzero pipeline status regardless of
          # whether grep actually matched. Command substitution drains tar to
          # completion first, so there is no early reader to break the pipe.
          tar_listing=$(tar -tzf rootfs.tar.gz)

          missing=0
          for path in etc/wsl.conf home/learner opt/shellforge/bin/check \
                      opt/shellforge/.sandbox-id usr/share/man/man1/ls.1.gz; do
            if ! grep -qE "^\.?/?${path//./\\.}/?$" <<< "$tar_listing"; then
              echo "MISSING from rootfs.tar.gz: $path"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "FAIL: the exported tarball is missing content wsl --import needs"
            exit 1
          fi
          echo "OK: rootfs.tar.gz has every required path"

      - name: Upload rootfs artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs
          path: |
            rootfs.tar.gz
            rootfs.tar.gz.sha256

  # -------------------------------------------------------------------------
  # The merge gate.
  #
  # GitHub only blocks a merge on checks listed as required in the ruleset. A
  # job that is not listed can fail and still be merged past, and a job added
  # later is not listed by definition. That is the hole this job closes.
  #
  # It depends on every other job, runs even when they fail, and fails if any
  # of them did not succeed. The ruleset requires THIS check, so any failing
  # job blocks the merge whether or not it is individually required.
  #
  # The individual checks stay in the ruleset as well. Belt and braces: this
  # job going missing or being renamed would otherwise silently open the hole
  # back up, and the meta-check in the `style` job guards against exactly that.
  # -------------------------------------------------------------------------
  all-green:
    name: All checks green
    runs-on: ubuntu-latest
    if: always()
    needs: [branch, style, test, security, docs, image]
    steps:
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # `branch` is the only job allowed to be skipped, and only because it
          # is scoped to pull_request events. Every other skip is treated as a
          # failure, so a job cannot escape the gate by not running.
          SKIPPABLE="branch"

          failed=0
          while read -r job result; do
            case "$result" in
              success)
                printf '  ok        %s\n' "$job"
                ;;
              skipped)
                if grep -qw "$job" <<<"$SKIPPABLE" && [ "$EVENT" != "pull_request" ]; then
                  printf '  skipped   %s (expected on %s)\n' "$job" "$EVENT"
                else
                  printf '  SKIPPED   %s (not allowed to skip here)\n' "$job"
                  failed=1
                fi
                ;;
              *)
                printf '  FAILED    %s (%s)\n' "$job" "$result"
                failed=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")

          if [ "$failed" -ne 0 ]; then
            echo
            echo "One or more checks did not pass. Merge is blocked."
            exit 1
          fi
          echo
          echo "All checks green."
